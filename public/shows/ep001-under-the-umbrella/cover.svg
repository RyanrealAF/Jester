<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#292725"/></linearGradient>
  <linearGradient id="brass" x1="0" y1="0" x2="0.9" y2="1"><stop offset="0" stop-color="#f1d49a"/><stop offset="0.5" stop-color="#ad7b39"/><stop offset="1" stop-color="#65441e"/></linearGradient>
</defs>
<rect width="1200" height="1200" fill="url(#bg)"/>
<circle cx="600" cy="435" r="300" fill="none" stroke="#6f2926" stroke-width="2" opacity=".65"/>
<path d="M260 395 Q600 100 940 395 Q860 370 800 425 Q730 365 660 425 Q600 365 535 425 Q450 365 390 425 Q325 370 260 395Z" fill="#18191a" stroke="#9a713c" stroke-width="5"/>
<path d="M600 392 L600 485" stroke="url(#brass)" stroke-width="14" stroke-linecap="round"/>
