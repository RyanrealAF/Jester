<text x="600" y="750" fill="#f0e7d5" font-family="Georgia,serif" font-size="76" text-anchor="middle" letter-spacing="8">RING MY BELL</text>
<text x="600" y="823" fill="#c8a66d" font-family="Arial,sans-serif" font-size="35" text-anchor="middle" letter-spacing="9">EPISODE 001</text>
<text x="600" y="885" fill="#f0e7d5" font-family="Arial,sans-serif" font-size="46" font-weight="700" text-anchor="middle" letter-spacing="4">UNDER THE UMBRELLA</text>
<path d="M260 930 H940" stroke="#6f2926" stroke-width="4"/>
<text x="600" y="985" fill="#b8b0a2" font-family="Arial,sans-serif" font-size="29" text-anchor="middle" letter-spacing="7">BUILD WHILE BLEEDING</text>
